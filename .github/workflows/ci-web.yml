name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-web-{0}', github.ref) || format('ci-web-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full Mechanical Gate (check:agent)
        run: pnpm run check:agent

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: deploy-sanakenno
      cancel-in-progress: false
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://erez.ac/hooks/deploy-sanakenno" \
            | grep -q "^200$"

      - name: Verify deploy landed
        run: |
          echo "Waiting for sanakenno.fi to serve commit ${GITHUB_SHA}..."
          for i in $(seq 1 120); do
            live=$(curl -fsS --max-time 10 https://sanakenno.fi/commit.txt 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live commit matches after ~$((i * 5))s."
              curl -fsS --max-time 10 https://sanakenno.fi/api/health
              exit 0
            fi
            sleep 5
          done
          echo "Timed out: live commit is '${live:-<none>}', expected '${GITHUB_SHA}'."
          echo "The server-side deploy failed or is stalled — check the Telegram alert."
          exit 1
